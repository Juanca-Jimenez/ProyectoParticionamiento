<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particionamiento Óptimo de Dependencias</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    #graph-initial, #graph-partitioned {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin: 10px 0;
      background-color: #f9f9f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Particionamiento Óptimo de Dependencias</h1>
    <section class="card">
      <h2>Entrada</h2>
      <div class="form-group">
        <label for="matrix-input">Matriz de dependencias (CSV sin encabezado)</label>
        <textarea id="matrix-input" rows="8" placeholder="0,1,2\n1,0,1\n2,1,0"></textarea>
      </div>
      <div class="form-row">
        <label for="k-input">Número de particiones (k)</label>
        <input id="k-input" type="number" min="2" max="5" value="2" />
      </div>
      <div class="form-row">
        <label for="default-matrix-select">Matrices predeterminadas</label>
        <select id="default-matrix-select">
          <option value="">-- Seleccionar --</option>
          <option value="small">Pequeña (4-8 componentes)</option>
          <option value="medium">Mediana (10-20 componentes)</option>
          <option value="large">Grande (>=30 componentes)</option>
        </select>
      </div>
      <div class="form-row">
        <button id="use-default-button">Usar matriz predeterminada</button>
      </div>
      <div class="form-row">
        <label for="csv-file">Cargar CSV</label>
        <input id="csv-file" type="file" accept=".csv" />
      </div>
      <button id="run-button">Ejecutar particionamiento</button>
    </section>

    <section class="card" id="graph-initial-card" style="display: none;">
      <h2>Grafo de Matriz Ingresada</h2>
      <div id="graph-initial"></div>
    </section>

    <section class="card" id="results-card">
      <h2>Resultados</h2>
      <div id="results"></div>
    </section>

    <section class="card" id="graph-partitioned-card" style="display: none;">
      <h2>Grafo de Particiones</h2>
      <div id="graph-partitioned"></div>
    </section>
  </div>
  <script src="js/api.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/visualization.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
